[project]
name = "ms-tb01"
version = "0.1.0"
description = "ms-tb01 using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "ag-ui-crewai>=0.3.1",
    "confluent-kafka>=2.15.1",
    "crewai[tools]>=1.15.22,<2.0.0",
    "fastapi[standard]>=0.115.12,<0.116.0",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
project_id = "66a1deba-6f2c-43ba-a6e6-7fa30631b94f"

[tool.hatch.build.targets.wheel]
packages = ["src/ms_tb01"]

[tool.uv]
package = true
