[project]
name = "ms-pb02"
version = "1.0.0"
description = "Gestión, generación y validación de tareas lógicas para IBNM"
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiokafka>=0.10.0",
    "asyncpg>=0.29.0",
    "crewai[tools]>=1.15.22,<2.0.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
]

[project.scripts]
ms-pb02 = "ms_pb02.main:main"
kickoff = "ms_pb02.main:kickoff"
run_crew = "ms_pb02.main:kickoff"
plot = "ms_pb02.main:plot"
run_with_trigger = "ms_pb02.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ms_pb02"]

[tool.crewai]
type = "flow"
project_id = "899f6576-fe02-4feb-b70b-913e72164d82"
