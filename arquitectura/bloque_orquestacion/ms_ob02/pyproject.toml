[project]
name = "ms-ob02"
version = "0.1.0"
description = "ms-ob02 using crewAI"
authors = [{ name = "Raul Montes de Oca", email = "raulmdoh@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "crewai[tools]>=1.15.22,<2.0.0",
    "pydantic-settings>=2.0.0",
    "pgvector>=0.2.0",
    "ollama>=0.1.0",
    "sqlmodel>=0.0.14",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "aiokafka>=0.10.0",
    "fastapi>=0.115.0",
    "netmiko>=4.3.0",
    "ncclient>=0.7.1",
    "ansible-runner>=2.4.3",
    "ansible-core>=2.18.0",
    "httpx>=0.28.0",

]

[project.scripts]
kickoff = "ms_ob02.main:kickoff"
run_crew = "ms_ob02.main:kickoff"
plot = "ms_ob02.main:plot"
run_with_trigger = "ms_ob02.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ms_ob02"]

[tool.crewai]
type = "flow"
project_id = "493248e1-c26d-4a9f-a4fe-af20e2911592"
